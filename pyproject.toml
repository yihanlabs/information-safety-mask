[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "information-safety-mask"
version = "0.1.0"
description = "Local image redaction workbench"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pillow>=11,<13",
  "pyvips[binary]==3.1.0",
  "cryptography==50.0.1",
  "psutil==7.2.2",
  "paddleocr==3.3.2",
  "paddlepaddle==3.2.2",
  "paddlex==3.3.13",
  "spacy==3.8.14",
  "zh-core-web-trf",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
safety-mask = "safety_mask.launcher:main"

[tool.uv.sources]
zh-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/zh_core_web_trf-3.8.0/zh_core_web_trf-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/safety_mask"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
