<style>

<div class="art">
  <div class="brand"><div class="icon"><svg width="32" height="36" viewBox="0 0 24 28" fill="none" aria-hidden="true"><path d="M12 2L21 6V13C21 20 16 24 12 26C8 24 3 20 3 13V6L12 2Z" stroke="currentColor" stroke-width="2"/><path d="m7 13 3 3 7-7" stroke="currentColor" stroke-width="2"/></svg></div><span class="name">隐去</span><span class="eyebrow">本地图片脱敏</span></div>

const scene=new URLSearchParams(location.search).get('scene');
